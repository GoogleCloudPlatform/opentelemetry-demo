ard}\nWhere Address is {string streetAddress, string city, string state, string country, string zipCode} and\nCreditCardInfo is {string creditCardNumber, int32 creditCardCvv, int32 creditCardExpirationYear, int32 creditCardExpirationMonth}", "name": "checkout", "parameters": {"properties": {"checkout_person": {}}, "required": ["checkout_person"], "type": "object"}}, "type": "function"}, {"function": {"description": "Empty the shopping cart for a user.", "name": "empty_cart", "parameters": {"properties": {"user_id": {"type": "string"}}, "required": ["user_id"], "type": "object"}}, "type": "function"}, {"function": {"description": "Fetch promotional ads for Astronomy Shop homepage.\nEg : category: `telescopes` or `travel`", "name": "get_ads", "parameters": {"properties": {"category": {"type": "string"}}, "required": ["category"], "type": "object"}}, "type": "function"}, {"function": {"description": "Retrieve the current contents of a user''s cart.", "name": "get_cart", "parameters": {"properties": {"user_id": {"type": "string"}}, "required": ["user_id"], "type": "object"}}, "type": "function"}, {"function": {"description": "Get detailed information about a product using its ID.", "name": "get_product", "parameters": {"properties": {"product_id": {"type": "string"}}, "required": ["product_id"], "type": "object"}}, "type": "function"}, {"function": {"description": "Get product recommendations for a user.", "name": "get_recommendations", "parameters": {"properties": {"product_id": {"type": "string"}}, "required": ["product_id"], "type": "object"}}, "type": "function"}, {"function": {"description": "Get estimated shipping cost for a given address.\n`items`: list of {productId, quantity} (a single dict is also accepted).\n`currency_code`: ISO 4217 code, e.g. \"USD\".\n`address`: {streetAddress, city, state, country, zipCode}.", "name": "get_shipping_quote", "parameters": {"properties": {"address": {}, "currency_code": {}, "items": {}}, "required": ["items", "currency_code"