apiVersion: v1
kind: ConfigMap
metadata:
  name: product-catalog-product-catalog-otel-config
  labels:
    
    opentelemetry.io/name: product-catalog
    
    app.kubernetes.io/version: "3.1.0"
    app.kubernetes.io/component: product-catalog
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/part-of: opentelemetry-demo
data:
  otel-config.yml: |
    file_format: "1.0"
    disabled: false
    logger_provider:
      processors:
        - batch:
            exporter:
              otlp_grpc:
                endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    meter_provider:
      readers:
        - periodic:
            exporter:
              otlp_grpc:
                endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
                temporality_preference: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-cumulative}
    tracer_provider:
      processors:
        - batch:
            exporter:
              otlp_grpc:
                endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    propagator:
      composite:
        - tracecontext:
        - baggage:
    resource:
      attributes_list: ${OTEL_RESOURCE_ATTRIBUTES}
