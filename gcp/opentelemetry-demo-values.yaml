# this file is used by Helm chart launch steps.
# when merging YAML with the default values, objects are merged but lists are overwritten.
# so, where a list is used, we have copied the defaults from the upstream values to preserve them.

# Disable redundant built-in monitoring tools
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false
jaeger:
  enabled: false

# Disable the default collector. We use GKE-managed OpenTelemetry instead.
# We map the expected 'otel-collector' service to the managed collector using an ExternalName service.
opentelemetry-collector:
  enabled: false

components:
  frontend-proxy:
    service:
      type: LoadBalancer
      annotations:
        networking.gke.io/internal-load-balancer-allow-global-access: "true"
        networking.gke.io/load-balancer-type: Internal

