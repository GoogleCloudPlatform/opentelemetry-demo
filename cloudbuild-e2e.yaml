steps:
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'Get GKE Credentials'
  env:
  - 'KUBECONFIG=/workspace/kubeconfig'
  args:
  - 'container'
  - 'clusters'
  - 'get-credentials'
  - '${_CLUSTER}'
  - '--zone=${_ZONE}'
  - '--project=${_PROJECT_ID}'

- name: 'golang:1.26'
  id: 'Build Verifier'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    cd internal/e2e/verifier
    CGO_ENABLED=0 go build -o verifier main.go

- name: 'gcr.io/cloud-builders/gcloud'
  id: 'Deploy and Verify'
  entrypoint: 'bash'
  env:
  - 'KUBECONFIG=/workspace/kubeconfig'
  - 'PROJECT_ID=${_PROJECT_ID}'
  args:
  - '-c'
  - |
    set -e
    NAMESPACE="otel-demo-pr-${_PR_NUMBER}-${SHORT_SHA}"
    cleanup() {
      echo "Cleaning up namespace $${NAMESPACE}..."
      kubectl delete namespace "$${NAMESPACE}" || true
    }
    trap cleanup EXIT

    # Install make (needed by deploy.sh)
    apt-get update && apt-get install -y make

    # Install Helm (v3.18.0 to support newer helm-diff)
    curl -fsSL -o helm.tar.gz https://get.helm.sh/helm-v3.18.0-linux-amd64.tar.gz
    tar -zxvf helm.tar.gz
    mv linux-amd64/helm /usr/local/bin/helm

    # Install Helmfile (v0.165.0)
    curl -fsSL -o helmfile.tar.gz https://github.com/helmfile/helmfile/releases/download/v0.165.0/helmfile_0.165.0_linux_amd64.tar.gz
    tar -zxvf helmfile.tar.gz
    mv helmfile /usr/local/bin/helmfile

    # Install helm-diff
    helm plugin install https://github.com/databus23/helm-diff

    echo "Creating namespace $${NAMESPACE}..."
    kubectl create namespace "$${NAMESPACE}"

    echo "Deploying demo..."
    ./gcp/deploy.sh -N "$${NAMESPACE}" -p "${_PROJECT_ID}"

    echo "Running verifier..."
    ./internal/e2e/verifier/verifier --project="${_PROJECT_ID}" --namespace="$${NAMESPACE}" --wait=2m --timeout=5m

substitutions:
  _CLUSTER: 'opentelemetry-demo-test'
  _ZONE: 'us-central1-c'
  _PROJECT_ID: 'opentelemetry-ops-e2e'
  _PR_NUMBER: '0'

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
